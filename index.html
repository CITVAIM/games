<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小游戏合集</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>小游戏合集</h1>
      <p class="subtitle">挑一个，随时来一局</p>
    </header>

    <main class="grid">
      <a class="card" href="https://2048-cjo.pages.dev" style="--accent:#edc22e;">
        <div class="thumb thumb-2048"><span>2048</span></div>
        <div class="info">
          <h2>2048</h2>
          <p>滑动方块，合并相同数字，凑出 2048。支持键盘与触屏。</p>
          <span class="cta">开始游戏 →</span>
        </div>
      </a>

      <a class="card" href="https://minesweeper-dz8.pages.dev" style="--accent:#ff3232;">
        <div class="thumb thumb-mine"><span>💣</span></div>
        <div class="info">
          <h2>扫雷</h2>
          <p>经典扫雷，初级 / 中级 / 高级三档难度，首次点击必定安全。</p>
          <span class="cta">开始游戏 →</span>
        </div>
      </a>

      <a class="card" href="https://snake-95c.pages.dev" style="--accent:#3fb950;">
        <div class="thumb thumb-emoji"><span>🐍</span></div>
        <div class="info">
          <h2>贪吃蛇</h2>
          <p>吃掉果实不断变长，越吃越快。方向键 / WASD / 触屏滑动均可操作。</p>
          <span class="cta">开始游戏 →</span>
        </div>
      </a>

      <a class="card" href="https://flappy-42p.pages.dev" style="--accent:#ffd53d;">
        <div class="thumb thumb-emoji"><span>🐤</span></div>
        <div class="info">
          <h2>像素小鸟</h2>
          <p>点击让小鸟飞起来，穿过管道间隙。单指操作，看看能飞多远。</p>
          <span class="cta">开始游戏 →</span>
        </div>
      </a>

      <a class="card" href="https://gomoku-eih.pages.dev" style="--accent:#e9c88a;">
        <div class="thumb thumb-emoji"><span style="font-size:34px;">⚫⚪</span></div>
        <div class="info">
          <h2>五子棋</h2>
          <p>15×15 棋盘，连成五子即胜。支持人机对战（带简易 AI）与双人对战。</p>
          <span class="cta">开始游戏 →</span>
        </div>
      </a>
    </main>

    <footer class="foot">
      <span>共 5 款游戏 · 纯前端 · 无需登录</span>
    </footer>
  </div>
</body>
</html>
